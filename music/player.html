<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Veil — Melodic House 122 · Kastoria FM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #07090f;
      --mist: #c8d0e0;
      --ice: #8fa3c4;
      --glow: #6b8cae;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      font-family: Outfit, sans-serif;
      color: var(--mist);
      background:
        radial-gradient(ellipse 90% 70% at 50% -10%, rgba(107, 140, 174, 0.28), transparent 55%),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(40, 60, 90, 0.45), transparent 50%),
        linear-gradient(180deg, #07090f 0%, #0c1220 50%, #06080e 100%);
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    .stage { width: min(34rem, 100%); text-align: center; }
    .brand {
      font-family: "Cormorant Garamond", serif;
      font-weight: 600;
      font-size: clamp(3.2rem, 12vw, 5rem);
      letter-spacing: 0.04em;
      line-height: 0.95;
      margin-bottom: 0.55rem;
      animation: rise 1.2s ease-out both;
    }
    .tag {
      color: var(--ice);
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 2.4rem;
      animation: rise 1.2s ease-out 0.12s both;
    }
    .player-wrap {
      border: 1px solid rgba(200, 208, 224, 0.12);
      background: rgba(255, 255, 255, 0.03);
      padding: 1.5rem 1.25rem 1.25rem;
      animation: rise 1.2s ease-out 0.25s both;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--ice);
      margin-bottom: 1rem;
    }
    audio { width: 100%; height: 2.75rem; accent-color: var(--glow); }
    .tracks {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--mist);
      background: transparent;
      border: 1px solid rgba(200, 208, 224, 0.22);
      padding: 0.55rem 1rem;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    button:hover, button.active {
      background: rgba(107, 140, 174, 0.22);
      border-color: var(--glow);
    }
    .note {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: rgba(143, 163, 196, 0.7);
      line-height: 1.45;
      animation: rise 1.2s ease-out 0.4s both;
    }
    .pulse {
      width: 100%;
      height: 2px;
      margin-top: 1.2rem;
      background: linear-gradient(90deg, transparent, var(--glow), transparent);
      background-size: 35% 100%;
      background-repeat: no-repeat;
      animation: sweep 3s ease-in-out infinite;
      opacity: 0.55;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes sweep {
      0% { background-position: -40% 0; }
      100% { background-position: 140% 0; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <h1 class="brand">Veil</h1>
    <p class="tag">122 BPM · Melodic House · Aria vocal</p>
    <div class="player-wrap">
      <div class="meta">
        <span id="label">Full track · 2:38</span>
        <span>C major</span>
      </div>
      <audio id="player" controls preload="metadata" src="aria_inspired_122bpm.mp3"></audio>
      <div class="tracks">
        <button type="button" class="active" data-src="aria_inspired_122bpm.mp3" data-label="Full track · 2:38">Full</button>
        <button type="button" data-src="aria_inspired_122bpm_preview.mp3" data-label="Preview · 1:03">Preview</button>
      </div>
      <div class="pulse" aria-hidden="true"></div>
    </div>
    <p class="note">Original track inspired by the atmosphere of Argy &amp; Omnya — Aria (122 BPM, heavy bass, soaring vocal). Not a cover.</p>
  </main>
  <script>
    const player = document.getElementById("player");
    const label = document.getElementById("label");
    document.querySelectorAll(".tracks button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tracks button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const wasPlaying = !player.paused;
        player.src = btn.dataset.src;
        label.textContent = btn.dataset.label;
        if (wasPlaying) player.play();
      });
    });
  </script>
</body>
</html>
