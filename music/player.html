<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Afro House 128 — Kastoria FM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sand: #e8d5b5;
      --ember: #c45c26;
      --ink: #1a120b;
      --soil: #2c1e14;
      --dust: #8a6f4e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      font-family: "DM Sans", sans-serif;
      color: var(--sand);
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(196, 92, 38, 0.35), transparent 55%),
        radial-gradient(ellipse 70% 50% at 90% 80%, rgba(138, 111, 78, 0.3), transparent 50%),
        linear-gradient(165deg, #1a120b 0%, #2c1e14 45%, #0f0a07 100%);
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    .stage {
      width: min(32rem, 100%);
      text-align: center;
    }
    .brand {
      font-family: "Bricolage Grotesque", sans-serif;
      font-weight: 800;
      font-size: clamp(2.8rem, 10vw, 4.2rem);
      letter-spacing: -0.03em;
      line-height: 0.95;
      margin-bottom: 0.6rem;
      animation: rise 1.1s ease-out both;
    }
    .brand span { color: var(--ember); }
    .tag {
      color: var(--dust);
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
      animation: rise 1.1s ease-out 0.15s both;
    }
    .player-wrap {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(232, 213, 181, 0.12);
      padding: 1.5rem 1.25rem 1.25rem;
      animation: rise 1.1s ease-out 0.3s both;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--dust);
      margin-bottom: 1rem;
    }
    audio {
      width: 100%;
      height: 2.75rem;
      accent-color: var(--ember);
    }
    .tracks {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--sand);
      background: transparent;
      border: 1px solid rgba(232, 213, 181, 0.28);
      padding: 0.55rem 1rem;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
    }
    button:hover, button.active {
      background: rgba(196, 92, 38, 0.25);
      border-color: var(--ember);
    }
    button:active { transform: scale(0.98); }
    .pulse {
      width: 100%;
      height: 3px;
      margin-top: 1.25rem;
      background: linear-gradient(90deg, transparent, var(--ember), transparent);
      background-size: 40% 100%;
      background-repeat: no-repeat;
      animation: sweep 2.5s ease-in-out infinite;
      opacity: 0.7;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes sweep {
      0% { background-position: -40% 0; }
      100% { background-position: 140% 0; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <h1 class="brand">Afro <span>House</span></h1>
    <p class="tag">128 BPM · African voices · Kastoria FM</p>
    <div class="player-wrap">
      <div class="meta">
        <span id="label">Full track · 2:15</span>
        <span>A minor</span>
      </div>
      <audio id="player" controls preload="metadata" src="afro_house_128bpm.mp3"></audio>
      <div class="tracks">
        <button type="button" class="active" data-src="afro_house_128bpm.mp3" data-label="Full track · 2:15">Full</button>
        <button type="button" data-src="afro_house_128bpm_preview.mp3" data-label="Preview · 1:00">Preview</button>
      </div>
      <div class="pulse" aria-hidden="true"></div>
    </div>
  </main>
  <script>
    const player = document.getElementById("player");
    const label = document.getElementById("label");
    document.querySelectorAll(".tracks button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tracks button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const wasPlaying = !player.paused;
        player.src = btn.dataset.src;
        label.textContent = btn.dataset.label;
        if (wasPlaying) player.play();
      });
    });
  </script>
</body>
</html>
